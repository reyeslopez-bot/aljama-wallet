name: Security - Static and Supply Chain
run-name: >-
  ${{
    github.event_name == 'schedule' &&
    'Static Security / Scheduled' ||
    github.event_name == 'pull_request' &&
    format('Static Security / PR {0}', github.event.pull_request.number) ||
    format('Static Security / {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (JavaScript / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm i -g pnpm@10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Build application
        env:
          NEXTAUTH_SECRET: codeql-nextauth-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_MAPBOX_TOKEN: ''
        run: pnpm build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --exclude node_modules \
            --exclude .next \
            --exclude contracts/lib \
            --exclude test-results \
            --exclude playwright-report \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy (Filesystem + Misconfig)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Run Trivy
        run: |
          mkdir -p "${{ runner.temp }}/trivy-cache"
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            -w /github/workspace \
            aquasec/trivy:0.68.2 \
            fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            --format sarif \
            --output trivy-results.sarif \
            --no-progress \
            .

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
