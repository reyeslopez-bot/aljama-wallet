          done

      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Install Playwright browsers (Chromium + WebKit)
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Device functional tests (Playwright)
        env:
          CI: true
          PLAYWRIGHT_EXTENDED_DEVICES: 'true'
        run: pnpm test:e2e:devices

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ubuntu-devices
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-ubuntu-devices
          path: test-results
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 4) Frontend CI: multi-browser (Chromium/Firefox/WebKit)
  # ─────────────────────────────────────────────
