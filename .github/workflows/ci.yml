name: CI - Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions: read-all

concurrency:
  group: aljama-wallet-${{ github.ref }}
  cancel-in-progress: true

env:
  XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233

jobs:
  # ─────────────────────────────────────────────
  # 1) Core Node CI: lint / test / Prisma / build
  # ─────────────────────────────────────────────
  build:
    name: Core CI (Node + pnpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.28.1 --activate

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Prisma format (CRDB + PG)
        run: pnpm prisma:format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test -- --reporter=github

      - name: Build Next.js app
        env:
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
        run: pnpm build

      - name: Check outdated dependencies
        run: pnpm outdated --depth 0 || true

      - name: Security audit
        run: pnpm audit --audit-level=moderate || true

      - name: License compliance check
        run: |
          pnpm dlx license-checker \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense;CC0-1.0" \
            --failOn "GPL-3.0;AGPL-3.0;LGPL-3.0;MPL-2.0" || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 2) Frontend CI: component + e2e (OS matrix + sharding)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI (${{ matrix.os }} · shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: ['1/2', '2/2']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.28.1 --activate

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: Frontend component tests (Vitest)
        if: matrix.shard == '1/2'
        run: pnpm test:frontend:components -- --reporter=github

      - name: Frontend functional tests (Playwright)
        env:
          CI: true
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 3) Container CI: Podman + Just inside image
  # ─────────────────────────────────────────────
  container:
    name: Container CI (Podman + Just)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Build dev container with Podman
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman build -t "$IMAGE_NAME" -f .devcontainer/Containerfile .

      - name: Ensure pnpm store volume
        run: |
          podman volume create aljama_pnpm_store || true

      - name: Run CI checks inside container (prefer just, strict fallback)
        env:
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman run --rm \
            -v "$(pwd):/workspace" \
            -v aljama_pnpm_store:/workspace/.pnpm-store \
            -w /workspace \
            -e PNPM_STORE_DIR=/workspace/.pnpm-store \
            -e XRPL_RPC_URL \
            -e XRPL_DEV_SEED \
            "$IMAGE_NAME" \
            bash -lc '
              set -euo pipefail
              corepack enable >/dev/null 2>&1 || true
              corepack prepare pnpm@10.28.1 --activate >/dev/null 2>&1 || true

              pnpm install --frozen-lockfile

              if command -v just >/dev/null 2>&1 && just -l | grep -qE "^\\s*ci\\b"; then
                just ci
              elif command -v just >/dev/null 2>&1 && just -l | grep -qE "^\\s*test\\b"; then
                just check
                just test
                pnpm build
              else
                pnpm lint
                pnpm typecheck
                pnpm test
                pnpm build
              fi
            '
