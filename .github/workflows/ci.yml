      - name: Production-like backend + frontend E2E
        env:
          CI: true
          PLAYWRIGHT_REAL_BACKEND: 'true'
          PLAYWRIGHT_NODE_ENV: 'production'
          PLAYWRIGHT_SERVER_COMMAND: pnpm build && bash ./scripts/standalone-artifact.sh run
          NEXTAUTH_SECRET: ci-prodlike-nextauth-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
        run: pnpm test:e2e:real-backend

      - name: Upload Playwright report
