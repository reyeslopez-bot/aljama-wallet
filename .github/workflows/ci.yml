              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Setup pnpm cache
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Download standalone runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime
          path: artifacts/standalone-runtime

      - name: Verify downloaded standalone runtime artifact
        shell: bash
        run: |
          test -f artifacts/standalone-runtime/server.js
          test -f artifacts/standalone-runtime/.next/BUILD_ID
          test -d artifacts/standalone-runtime/.next/static
          test -d artifacts/standalone-runtime/public

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production-like backend + frontend E2E
        env:
          CI: true
          PLAYWRIGHT_REAL_BACKEND: 'true'
          PLAYWRIGHT_NODE_ENV: 'production'
          PLAYWRIGHT_SERVER_COMMAND: cd artifacts/standalone-runtime && HOSTNAME=127.0.0.1 PORT=3000 node server.js
          NEXTAUTH_SECRET: ci-prodlike-nextauth-secret-32chars-ok
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          COCKROACH_URL: postgresql://ci:ci@127.0.0.1:26257/ci_prodlike
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
        run: pnpm test:e2e:real-backend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ubuntu-prodlike
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
