name: CI - Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm FIRST so cache can detect it
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (if present)
        run: pnpm lint --if-present

      - name: Test (if present)
        run: pnpm test --if-present

      - name: Build
        run: pnpm build
