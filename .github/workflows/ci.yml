name: CI - Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # or 23 if you prefer, both work
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.10.0
          run_install: true

      - name: Lint (if defined)
        run: pnpm lint --if-present

      - name: Test (if defined)
        run: pnpm test --if-present

      - name: Build Next.js app
        run: pnpm build
