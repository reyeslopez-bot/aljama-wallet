name: CI - Aljama Wallet
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI / PR {0}', github.event.pull_request.number) ||
    format('CI / {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: aljama-wallet-${{ github.ref }}
  cancel-in-progress: true


env:
  XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233
  NEXTAUTH_SECRET: ci-nextauth-secret
  NEXTAUTH_URL: http://127.0.0.1:3000
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  # ─────────────────────────────────────────────
  # 1) Core Node CI: lint / test / Prisma / build
  # ─────────────────────────────────────────────
  build:
    name: Core CI (Node + pnpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if npm i -g pnpm@10.28.1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Setup pnpm cache
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify build-script policy
        shell: bash
        run: |
          ignored_builds="$(pnpm ignored-builds)"
          auto_ignored="$(printf '%s\n' "$ignored_builds" | awk '
            /^Automatically ignored builds during installation:/ { capture=1; next }
            /^$/ && capture { exit }
            capture { print }
          ' | sed 's/^[[:space:]]*//')"
          if [ "$auto_ignored" != "None" ]; then
            echo "$ignored_builds"
            echo "Unexpected blocked build scripts detected. Add each package to pnpm.onlyBuiltDependencies or pnpm.ignoredBuiltDependencies."
            exit 1
          fi
          echo "Build-script policy matches pnpm allow/ignore lists."

      - name: Detect Npm Signatures
        run: |
          if grep -R '"npm-signatures"' node_modules/*/package.json 2>/dev/null; then
            echo "Npm Signatures detected"
            exit 1
          fi
      - name: Generate SBOM
        shell: bash
        run: |
          pnpm --package=@cyclonedx/cyclonedx-npm dlx cyclonedx-npm \
            --ignore-npm-errors \
            --output-format json \
            --output-file sbom.json

      - name: Upload SBOM 
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
      
      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Start temporary bootstrap databases
        shell: bash
        run: |
          docker run -d \
            --name aljama-ci-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 55432:5432 \
            postgres:16

          for attempt in $(seq 1 30); do
            if docker exec aljama-ci-pg pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aljama-ci-pg || true
              exit 1
            fi
            sleep 1
          done

          docker exec aljama-ci-pg psql -U postgres -d postgres -c 'CREATE DATABASE aljama_wallet;'

          docker run -d \
            --name aljama-ci-crdb \
            -p 26257:26257 \
            -p 18080:8080 \
            cockroachdb/cockroach:v24.1.3 \
            start-single-node --insecure --http-addr=0.0.0.0:8080 --store=/cockroach/cockroach-data

          for attempt in $(seq 1 30); do
            if docker exec aljama-ci-crdb cockroach sql --insecure --host=localhost -e 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs aljama-ci-crdb || true
              exit 1
            fi
            sleep 1
          done

          docker exec aljama-ci-crdb cockroach sql --insecure --host=localhost -e 'CREATE DATABASE aljama_wallet;'

      - name: Verify database bootstrap contracts
        env:
          PG_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/aljama_wallet
          CRDB_DATABASE_URL: postgresql://root@127.0.0.1:26257/aljama_wallet?sslmode=disable
        run: pnpm test:db:bootstrap

      - name: Dump bootstrap database logs
        if: failure()
        shell: bash
        run: |
          docker logs aljama-ci-pg || true
          docker logs aljama-ci-crdb || true

      - name: Cleanup bootstrap databases
        if: always()
        shell: bash
        run: |
          docker rm -f aljama-ci-pg aljama-ci-crdb >/dev/null 2>&1 || true

      - name: Prisma format (CRDB + PG)
        run: pnpm prisma:format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Guardrail tests
        run: pnpm test:guardrails

      - name: Test (Vitest)
        run: pnpm test

      - name: Build Next.js app
        env:
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        run: pnpm build

      - name: Verify standalone runtime artifact
        env:
          PORT: '3100'
          NEXTAUTH_URL: http://127.0.0.1:3100
          NEXTAUTH_SECRET: ci-standalone-verify-nextauth-secret-32ch
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          COCKROACH_URL: postgresql://ci:ci@127.0.0.1:26257/ci_verify
        run: bash ./scripts/standalone-artifact.sh verify

      - name: Prepare standalone runtime artifact
        run: bash ./scripts/standalone-artifact.sh prepare artifacts/standalone-runtime

      - name: Upload standalone runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-runtime
          path: artifacts/standalone-runtime
          include-hidden-files: true
          if-no-files-found: error

      - name: Check outdated dependencies
        run: pnpm outdated --depth 0 || true

      - name: Security audit
        run: pnpm audit --audit-level=moderate || true

      - name: License compliance check
        run: |
          pnpm dlx license-checker \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense;CC0-1.0" \
            --failOn "GPL-3.0;AGPL-3.0;LGPL-3.0;MPL-2.0" || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 2) Frontend CI: component + e2e (OS matrix + sharding)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI (${{ matrix.os }} · shard ${{ matrix.shard }}-of-2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if npm i -g pnpm@10.28.1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Setup pnpm cache
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify dependency author
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/')
        shell: bash
        run: |
          if [[ "${{ github.actor }}" != "dependabot[bot]" ]]; then
            echo "Dependency changes must come from Dependabot"
            exit 1
          fi
      
      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: Frontend component tests (Vitest)
        if: matrix.shard == 1
        run: pnpm test:frontend:components

      - name: Frontend functional tests (Playwright)
        env:
          CI: true
          PLAYWRIGHT_SERVER_COMMAND: pnpm exec next dev --turbopack --port 3000
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}-shard-${{ matrix.shard }}-of-2
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.os }}-shard-${{ matrix.shard }}-of-2
          path: test-results
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 3) Frontend CI: explicit mobile/tablet device coverage
  # ─────────────────────────────────────────────
