name: CI - Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233
  XRPL_DEV_SEED: sn3nxiW7v8KXzPzAqzyHXbSSKNuN9

jobs:
  # ─────────────────────────────────────────────
  # 1) Core Node CI: lint / test / Prisma / build
  # ─────────────────────────────────────────────
  build:
    name: Core CI (Node + pnpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # ❌ no `cache: pnpm` here

      - name: Enable corepack + pnpm 10.24.0
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (CRDB + PG)
        run: pnpm prisma:generate

      - name: Prisma format (CRDB + PG)
        run: pnpm prisma:format

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Build Next.js app
        env:
          XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233
          XRPL_DEV_SEED: sn3nxiW7v8KXzPzAqzyHXbSSKNuN9
        run: pnpm build

      - name: Check outdated dependencies
        run: pnpm outdated --depth 0 || true

      - name: Security audit
        run: pnpm audit --audit-level=moderate || true

      - name: License compliance check
        run: |
          pnpm dlx license-checker \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense;CC0-1.0" \
            --failOn "GPL-3.0;AGPL-3.0;LGPL-3.0;MPL-2.0" || true

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore


  # ─────────────────────────────────────────────
  # 2) Container CI: Podman + Just inside image
  # ─────────────────────────────────────────────
  container:
    name: Container CI (Podman + Just)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Build dev container with Podman
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman build -t "$IMAGE_NAME" -f .devcontainer/Containerfile .

      - name: Ensure pnpm store volume
        run: |
          podman volume create aljama_pnpm_store || true

      - name: Run tests inside container (prefer just, fallback pnpm)
        run: |
          IMAGE_NAME=aljama-wallet-ci

          podman run --rm \
            -v "$(pwd):/workspace" \
            -v aljama_pnpm_store:/root/.pnpm-store \
            -w /workspace \
            -e XRPL_RPC_URL \
            -e XRPL_DEV_SEED \
            "$IMAGE_NAME" \
            bash -lc '
              pnpm install --frozen-lockfile && \
              if command -v just >/dev/null 2>&1 && just -l | grep -qE "ci|test"; then
                (just ci || just test) || pnpm test
              else
                pnpm test
              fi
            '
