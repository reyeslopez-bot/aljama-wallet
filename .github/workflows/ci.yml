  # ─────────────────────────────────────────────
  # 5) Frontend CI: production-like real backend E2E
  # ─────────────────────────────────────────────
  frontend-prodlike:
    name: Frontend CI (Ubuntu · Prod-like backend)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
