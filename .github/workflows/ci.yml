name: CI – Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Core Node CI: lint / test / Prisma / build / audits
  # ─────────────────────────────────────────────────────────────
  build:
    name: Core CI (Node + pnpm)
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) Setup Node & pnpm
      - name: Setup Node 23
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Enable corepack + pnpm 10.10.0
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate
          pnpm -v

      # 3) Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4) Setup Prisma
      - name: Prisma generate
        run: pnpm prisma generate

      - name: Validate Prisma schema format
        run: pnpm prisma format

      - name: Check if migrations can be applied cleanly
        run: |
          if [ -f prisma/crdb/schema.prisma ]; then
            echo "Checking CRDB migrations..."
            pnpm prisma migrate deploy --schema=prisma/crdb/schema.prisma --dry-run
          fi

          if [ -f prisma/pg/schema.prisma ]; then
            echo "Checking Postgres migrations..."
            pnpm prisma migrate deploy --schema=prisma/pg/schema.prisma --dry-run
          fi

      # 7) Lint
      - name: Lint
        run: pnpm lint --no-error-on-unmatched-pattern

      # 8) Unit tests (Vitest)
      - name: Test (Vitest)
        run: pnpm test --run

      # 9) Build Next.js (needs XRPL env)
      - name: Build Next.js app
        env:
          XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233
          XRPL_DEV_SEED: sn3nxiW7v8KXzPzAqzyHXbSSKNuN9
        run: pnpm build

      # 10) Dependency audit (non-blocking)
      - name: Check outdated dependencies
        run: pnpm outdated --depth 0 || true

      # 11) Security audit (non-blocking)
      - name: Security audit
        run: pnpm audit --audit-level=moderate || true

      # 12) License compliance (non-blocking, via just-in-time tool)
      - name: License compliance check
        run: |
          pnpm dlx license-checker \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense;CC0-1.0" \
            --failOn "GPL-3.0;AGPL-3.0;LGPL-3.0;MPL-2.0" || true

      # 13) Upload coverage (if exists)
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 2) Container CI: Podman build + tests via just (or pnpm)
  # ─────────────────────────────────────────────────────────────
  container:
    name: Container CI (Podman + Just)
    runs-on: ubuntu-latest
    needs: build   # only run if core CI passes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      # Optional: login to GHCR if you later want to push images
      # - name: Login to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.CR_PAT }}

      - name: Build dev container with Podman
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman build -t "$IMAGE_NAME" -f .devcontainer/Containerfile .

      - name: Run tests inside container (prefer just, fallback pnpm)
        env:
          XRPL_RPC_URL: wss://s.altnet.rippletest.net:51233
          XRPL_DEV_SEED: sn3nxiW7v8KXzPzAqzyHXbSSKNuN9
        run: |
          IMAGE_NAME=aljama-wallet-ci

          podman run --rm \
            -e XRPL_RPC_URL \
            -e XRPL_DEV_SEED \
            "$IMAGE_NAME" \
            bash -lc '
              if command -v just >/dev/null 2>&1; then
                if just -l | grep -qE "ci|test"; then
                  (just ci 2>/dev/null) || (just test 2>/dev/null) || pnpm test --run
                else
                  pnpm test --run
                fi
              else
                pnpm test --run
              fi
            '
