name: CI - Aljama Wallet

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 23
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Enable corepack + pnpm 10.10.0
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Optional: only runs if you actually have prisma schema + script
      - name: Generate Prisma client (if schema present)
        run: |
          if [ -f prisma/schema.prisma ]; then
            echo "Found prisma/schema.prisma, running prisma:generate"
            pnpm prisma:generate
          else
            echo "No prisma/schema.prisma found, skipping prisma:generate"
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build Next.js app
        run: pnpm build
