  # ─────────────────────────────────────────────
  # 7) XRPL live integration (env-gated)
  # ─────────────────────────────────────────────
  xrpl-live-integration:
    name: XRPL Live Integration (Testnet)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if npm i -g pnpm@10.28.1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm -v

      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Live XRPL integration tests
        env:
          RUN_XRPL_INTEGRATION_TESTS: ${{ secrets.XRPL_DEV_SEED != '' && 'true' || 'false' }}
          XRPL_INTEGRATION_NETWORK_ID: testnet
          XRPL_INTEGRATION_REQUEST_TIMEOUT_MS: '12000'
          XRPL_INTEGRATION_LATENCY_BUDGET_MS: '30000'
          XRPL_INTEGRATION_FUZZ_CASES: '8'
          CI: true
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
        run: pnpm test:integration:xrpl

  # ─────────────────────────────────────────────
  # 7) Container CI: Podman + Just inside image
  # ─────────────────────────────────────────────
  container:
    name: Container CI (Podman + Just)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Build dev container with Podman
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman build \
            --target ci \
            -t "$IMAGE_NAME" \
            --build-arg NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            --build-arg NEXTAUTH_URL="$NEXTAUTH_URL" \
            -f .devcontainer/Containerfile .

      - name: Ensure pnpm store volume
        run: |
          podman volume create aljama_pnpm_store || true

      - name: Run CI checks inside container (prefer just, strict fallback)
        env:
          XRPL_RPC_URL: ${{ env.XRPL_RPC_URL }}
          XRPL_DEV_SEED: ${{ secrets.XRPL_DEV_SEED }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
        run: |
          IMAGE_NAME=aljama-wallet-ci
          podman run --rm \
            -v "$(pwd):/workspace" \
            -v aljama_pnpm_store:/workspace/.pnpm-store \
            -w /workspace \
            -e PNPM_STORE_DIR=/workspace/.pnpm-store \
            -e XRPL_RPC_URL \
            -e XRPL_DEV_SEED \
            -e NEXTAUTH_SECRET \
            -e NEXTAUTH_URL \
            "$IMAGE_NAME" \
            bash -lc '
              set -euo pipefail
              if ! command -v pnpm >/dev/null 2>&1; then
                npm config set registry https://registry.npmjs.org/
                npm i -g pnpm@10.28.1
              fi

              pnpm config set registry https://registry.npmjs.org/
              for attempt in 1 2 3; do
                if pnpm install --frozen-lockfile; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "pnpm install failed after 3 attempts"
                  exit 1
                fi
                sleep $((attempt * 15))
              done

              if command -v just >/dev/null 2>&1 && just -l | grep -qE "^\\s*ci\\b"; then
                just ci
              elif command -v just >/dev/null 2>&1 && just -l | grep -qE "^\\s*test\\b"; then
                just check
                just test
                pnpm build
              else
                pnpm lint
                pnpm typecheck
                pnpm test
                pnpm build
              fi
            '
