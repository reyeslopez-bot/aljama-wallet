name: Security - Web DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed preview/base URL to scan
        required: false
        type: string
      scan_profile:
        description: ZAP scan depth
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - full
          - both
      fail_on_alerts:
        description: Fail the workflow when scanners report findings
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

env:
  TARGET_URL: ${{ github.event.inputs.target_url || vars.SECURITY_SCAN_TARGET_URL }}

jobs:
  zap-baseline:
    name: ZAP Baseline
    if: ${{ env.TARGET_URL != '' && (github.event_name == 'schedule' || github.event.inputs.scan_profile == 'baseline' || github.event.inputs.scan_profile == 'both') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate scan target
        run: test -n "$TARGET_URL"

      - name: Run ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          allow_issue_writing: false
          fail_action: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_alerts == 'true' }}
          cmd_options: '-a -j'

  zap-full:
    name: ZAP Full Scan
    if: ${{ env.TARGET_URL != '' && github.event_name == 'workflow_dispatch' && (github.event.inputs.scan_profile == 'full' || github.event.inputs.scan_profile == 'both') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate scan target
        run: test -n "$TARGET_URL"

      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ env.TARGET_URL }}
          allow_issue_writing: false
          fail_action: ${{ github.event.inputs.fail_on_alerts == 'true' }}
          cmd_options: '-a'

  nuclei:
    name: Nuclei
    if: ${{ env.TARGET_URL != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Validate scan target
        run: test -n "$TARGET_URL"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Nuclei
        run: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Run Nuclei
        run: |
          EXIT_CODE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.fail_on_alerts }}" = "true" ]; then
            EXIT_CODE_FLAG="-exit-code 1"
          fi

          "$(go env GOPATH)/bin/nuclei" \
            -u "$TARGET_URL" \
            -severity medium,high,critical \
            -json-export nuclei-results.json \
            -o nuclei-results.txt \
            $EXIT_CODE_FLAG

      - name: Upload Nuclei artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuclei-results
          path: |
            nuclei-results.json
            nuclei-results.txt
          if-no-files-found: ignore
