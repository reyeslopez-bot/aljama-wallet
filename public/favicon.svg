<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Sand gradient (background dunes) -->
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"></stop>
      <stop offset="50%" stop-color="#e6cfa3"></stop>
      <stop offset="100%" stop-color="#caa46a"></stop>
    </linearGradient>

    <!-- Silver gradient (branch) -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f3f5"></stop>
      <stop offset="40%" stop-color="#c4c9ce"></stop>
      <stop offset="100%" stop-color="#7f868c"></stop>
    </linearGradient>
  </defs>

  <!-- Soft dune background -->
  <rect width="64" height="64" rx="14" fill="url(#sand)"></rect>

  <!-- Dune layers (subtle depth) -->
  <path d="M0 42 Q16 34 32 40 T64 38 V64 H0 Z" fill="#d8b98a" opacity="0.6"></path>
  <path d="M0 48 Q20 40 40 46 T64 44 V64 H0 Z" fill="#caa46a" opacity="0.5"></path>

  <!-- Olive branch -->
  <path d="M14 50 C26 30, 44 20, 54 12" stroke="url(#silver)" stroke-width="2.8" stroke-linecap="round" fill="none"></path>

  <!-- Leaves -->
  <ellipse cx="26" cy="36" rx="4" ry="2.2" transform="rotate(-28 26 36)" fill="url(#silver)"></ellipse>
  <ellipse cx="34" cy="30" rx="4" ry="2.2" transform="rotate(-24 34 30)" fill="url(#silver)"></ellipse>
  <ellipse cx="42" cy="24" rx="4" ry="2.2" transform="rotate(-18 42 24)" fill="url(#silver)"></ellipse>
  <ellipse cx="50" cy="18" rx="3.8" ry="2" transform="rotate(-12 50 18)" fill="url(#silver)"></ellipse>
</svg>